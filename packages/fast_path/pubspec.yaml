name: fast_path
description: >-
  A pure-Dart implementation of a 2D path API with feature parity to Flutter's
  Path. Avoids native bindings so geometry work stays on the Dart heap and
  benefits from the Dart garbage collector.
version: 0.1.0
repository: https://github.com/yjbanov/fast_path
issue_tracker: https://github.com/yjbanov/fast_path/issues

resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  fast_geometry: any

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
