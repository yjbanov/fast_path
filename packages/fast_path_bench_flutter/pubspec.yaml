name: fast_path_bench_flutter
description: >-
  Flutter-hosted benchmarks comparing fast_path against dart:ui Path in
  AOT-compiled runtimes. Builds as a desktop app (runs benches at startup
  and exits) and as a web app (manual "Run benchmarks" button). Not
  published to pub.dev.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  fast_path: any
  fast_path_bench: any
  benchmark_harness: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  uses-material-design: true
