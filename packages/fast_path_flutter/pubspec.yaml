name: fast_path_flutter
description: >-
  Flutter bridge for fast_path, providing interoperability between fast_path's
  pure-Dart path types and Flutter's dart:ui Path API.
version: 0.1.0
repository: https://github.com/yjbanov/fast_path
issue_tracker: https://github.com/yjbanov/fast_path/issues

resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  fast_path: any
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
