name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provides both `flutter` and `dart`. The conformance and bridge
      # packages need Flutter; the core package would build with plain Dart
      # alone, but pulling Flutter once keeps the workflow simple.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test bench_core
        working-directory: packages/bench_core
        run: dart test --reporter=expanded

      - name: Test fast_geometry
        working-directory: packages/fast_geometry
        run: dart test --reporter=expanded

      - name: Test fast_path
        working-directory: packages/fast_path
        run: dart test --reporter=expanded

      # Fast wiring + anti-DCE check of the matrix benchmark suite. Exercises
      # the catalog, runner, and every Matrix/Matrix4 benchmark once instead of
      # running a full ~2s-per-bench measurement sweep.
      - name: Smoke-run geometry benchmarks
        run: ./tool/bench.sh --suite=geometry --smoke

      - name: Conformance tests vs dart:ui
        working-directory: packages/fast_path_conformance
        # --no-pub: workspace already resolved by `dart pub get` above.
        run: flutter test --reporter=expanded --no-pub
